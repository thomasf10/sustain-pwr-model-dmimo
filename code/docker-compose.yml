# Convenience wrapper: `docker compose up` from the code/ directory.
services:
  power-gui:
    build:
      context: .
      dockerfile: Dockerfile
    image: fr3-dmimo-power-gui
    container_name: fr3-dmimo-power-gui
    ports:
      - "8501:8501"
    restart: unless-stopped
    # For live editing during development, uncomment to mount the source over
    # the image copy (Streamlit auto-reloads on change):
